services:
  forgejo:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        FORGEJO_VERSION: ${FORGEJO_VERSION}
    image: forgejo:${FORGEJO_VERSION}
    container_name: forgejo
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      USER_UID: "1000"
      USER_GID: "1000"

      FORGEJO__server__DOMAIN: "git.${DOMAIN_NAME}${TLD}"
      FORGEJO__server__ROOT_URL: "https://git.${DOMAIN_NAME}${TLD}/"
      FORGEJO__server__HTTP_PORT: "3000"
      FORGEJO__server__DISABLE_SSH: "true"
      FORGEJO__server__LFS_START_SERVER: "true"
      FORGEJO__server__LFS_JWT_SECRET: ${FORGEJO_LFS_JWT_SECRET}
      FORGEJO__server__OFFLINE_MODE: "true"

      FORGEJO__database__DB_TYPE: "postgres"
      FORGEJO__database__HOST: "db-forgejo:5432"
      FORGEJO__database__NAME: ${FORGEJO_DB_NAME}
      FORGEJO__database__USER: ${FORGEJO_DB_USER}
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__database__SSL_MODE: "disable"

      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN}
      FORGEJO__oauth2__JWT_SECRET: ${FORGEJO_OAUTH2_JWT_SECRET}

      FORGEJO__service__DISABLE_REGISTRATION: "true"
      FORGEJO__service__REGISTER_EMAIL_CONFIRM: "false"
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: "false"
      FORGEJO__service__DEFAULT_KEEP_EMAIL_PRIVATE: "true"
      FORGEJO__service__NO_REPLY_ADDRESS: "noreply.git.${DOMAIN_NAME}${TLD}"
      FORGEJO__openid__ENABLE_OPENID_SIGNIN: "false"

      FORGEJO__mailer__ENABLED: ${FORGEJO_MAIL_ENABLED}
      FORGEJO__mailer__PROTOCOL: "smtp"
      FORGEJO__mailer__SMTP_ADDR: ${FORGEJO_MAIL_HOST}
      FORGEJO__mailer__SMTP_PORT: ${FORGEJO_MAIL_PORT}
      FORGEJO__mailer__USER: ${FORGEJO_MAIL_USER}
      FORGEJO__mailer__PASSWD: ${FORGEJO_MAIL_PASSWORD}
      FORGEJO__mailer__FROM: ${FORGEJO_MAIL_FROM}

      FORGEJO__actions__ENABLED: "true"
      FORGEJO__actions__DEFAULT_ACTIONS_URL: ${FORGEJO_ACTIONS_DEFAULT_URL:-https://data.forgejo.org}
    volumes:
      - forgejo-data:/data
    networks:
      - proxy
      - forgejo_internal
      - forgejo_runner
    depends_on:
      db-forgejo:
        condition: service_healthy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.forgejo.rule: "Host(`git.${DOMAIN_NAME}${TLD}`) || Host(`repo.${DOMAIN_NAME}${TLD}`) || Host(`forgejo.${DOMAIN_NAME}${TLD}`)"
      traefik.http.routers.forgejo.entrypoints: "websecure"
      traefik.http.routers.forgejo.tls.certResolver: "letsencrypt"
      traefik.http.routers.forgejo.middlewares: "forgejo-auth@file,secure-headers@file"
      traefik.http.services.forgejo.loadbalancer.server.port: "3000"

  forgejo-runner:
    build:
      context: ./runner
      dockerfile: Dockerfile
      args:
        FORGEJO_RUNNER_VERSION: ${FORGEJO_RUNNER_VERSION}
    image: forgejo-runner:${FORGEJO_RUNNER_VERSION}
    container_name: forgejo-runner
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      FORGEJO_INSTANCE_URL: "http://forgejo:3000"
      FORGEJO_ADMIN_NAME: ${FORGEJO_ADMIN_NAME}
      FORGEJO_ADMIN_PASSWORD: ${FORGEJO_ADMIN_PASSWORD}
      FORGEJO_RUNNER_NAME: ${FORGEJO_RUNNER_NAME:-forgejo-runner}
      FORGEJO_RUNNER_LABELS: ${FORGEJO_RUNNER_LABELS:-ubuntu-latest:docker://ghcr.io/catthehacker/ubuntu:act-latest}
      FORGEJO_RUNNER_CAPACITY: ${FORGEJO_RUNNER_CAPACITY:-2}
      FORGEJO_RUNNER_TIMEOUT: ${FORGEJO_RUNNER_TIMEOUT:-3h}
      FORGEJO_RUNNER_NETWORK: "forgejo_runner"
      FORGEJO_RUNNER_DOCKER_HOST: ${FORGEJO_RUNNER_DOCKER_HOST:-automount}
      FORGEJO_RUNNER_LOG_LEVEL: ${FORGEJO_RUNNER_LOG_LEVEL:-info}
    volumes:
      - forgejo-runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-0}"
    depends_on:
      forgejo:
        condition: service_started
    networks:
      - forgejo_runner

  db-forgejo:
    image: postgres:18
    container_name: db-forgejo
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_DB: ${FORGEJO_DB_NAME}
      POSTGRES_USER: ${FORGEJO_DB_USER}
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
    volumes:
      - db-forgejo:/var/lib/postgresql
    networks:
      - forgejo_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FORGEJO_DB_USER} -d ${FORGEJO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true
  forgejo_internal:
    name: forgejo_internal
    internal: true
  # Réseau dédié aux conteneurs de jobs Actions : accès Internet et à Forgejo,
  # mais pas aux autres services du réseau proxy.
  forgejo_runner:
    name: forgejo_runner

volumes:
  forgejo-data:
    name: forgejo-data
    labels:
      should.backup: "true"
  forgejo-runner-data:
    name: forgejo-runner-data
  db-forgejo:
    name: db-forgejo
    labels:
      should.backup: "true"
