services:
  code-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: code-server:${CODE_SERVER_VERSION}
    container_name: code-server
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PASSWORD: ${CODE_SERVER_PASSWORD}
      DEFAULT_WORKSPACE: /home/coder/workspace
      CODE_SERVER_THEME: ${CODE_SERVER_THEME:-Default High Contrast}
      CODE_SERVER_CLONE_GITHUB_ORG: ${CODE_SERVER_CLONE_GITHUB_ORG:-true}
      CODE_SERVER_GITHUB_ORG_URL: ${CODE_SERVER_GITHUB_ORG_URL:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_USER: ${GITHUB_USER:-x-access-token}
      FORGEJO_INTERNAL_URL: ${FORGEJO_INTERNAL_URL:-http://forgejo:3000}
      FORGEJO_OWNER: ${FORGEJO_OWNER:-}
      FORGEJO_ADMIN_NAME: ${FORGEJO_ADMIN_NAME:-}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}
    volumes:
      - code-server-data:/home/coder/.local/share/code-server
      - code-server-workspace:/home/coder/workspace
    networks:
      - proxy
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${PROXY_NETWORK}
      traefik.http.routers.code-server.rule: "Host(`code.${DOMAIN_NAME}${TLD}`) || Host(`vscode.${DOMAIN_NAME}${TLD}`)"
      traefik.http.routers.code-server.entrypoints: "websecure"
      traefik.http.routers.code-server.tls.certResolver: "letsencrypt"
      traefik.http.routers.code-server.middlewares: "code-server-auth@file,secure-headers@file"
      traefik.http.services.code-server.loadbalancer.server.port: "8080"

networks:
  proxy:
    name: ${PROXY_NETWORK}
    external: true

volumes:
  code-server-data:
    name: code-server-data
    labels:
      should.backup: "true"
  code-server-workspace:
    name: code-server-workspace
    labels:
      should.backup: "true"
