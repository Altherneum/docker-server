[traefik-env]
enabled = true
filter = traefik-env
logpath = /var/log/traefik/access.log
port = http,https
maxretry = 1
findtime = 24h
bantime = 24h
# Dockhand est un explorateur de fichiers : il lit des .env via son API.
# On ignore ses requêtes (RequestHost dockhand.<domaine>) pour ne pas bannir
# un administrateur qui consulte un fichier .env depuis l'interface.
ignoreregex = ^.*"RequestHost":"dockhand\.[^"]*".*$
